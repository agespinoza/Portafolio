<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Trajectory Chart</title>
<style>
:root{--color-bg:#f2f6fb;--color-text:#17243b;--color-border:#195373;--color-accent:#b45309}
*{margin:0;padding:0;box-sizing:border-box}
body{font:1rem system-ui;color:var(--color-text);background:var(--color-bg);display:flex;flex-direction:column;min-height:100vh}
header{background:white;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:100}
.nav{padding:.75rem 1rem}
.nav__inner{max-width:52rem;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.brand{text-decoration:none;color:var(--color-text);font-weight:600;display:flex;align-items:center;gap:.5rem}
.brand:hover{color:var(--color-accent)}
.nav__link{text-decoration:none;color:var(--color-text);padding:.5rem 1rem;border-radius:.35rem}
.nav__link:hover{background:#f0f0f0;color:var(--color-accent)}
main{flex:1;max-width:52rem;width:100%;margin:3rem auto;padding:0 1rem}
svg{display:block;width:100%;background:white;border-radius:1rem;margin:1rem 0}
circle{cursor:pointer;fill:#155e75}circle:focus,circle.active{fill:var(--color-accent);stroke:var(--color-text);stroke-width:2}
select{font:inherit;padding:.35rem}text{font:13px system-ui}
h1{margin-bottom:1.5rem}
label{display:block;margin-bottom:.5rem;font-weight:500}
</style>
<header class="nav">
  <div class="nav__inner">
    <a class="brand" href="../../index.html#projects">← Portfolio</a>
  </div>
</header>
<main>
  <h1>Simulated trajectory</h1>
  <label for="point">Point in time</label> <select id="point" disabled></select>
  <svg id="chart" viewBox="0 0 640 330" role="group" aria-label="Trajectory positions in kilometers"></svg>
  <p id="details" aria-live="polite">Loading trajectory…</p>
</main>
<script type="module" src="chart.js"></script>
</html>
