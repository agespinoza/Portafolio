<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspection Status</title>
<style>
:root{--color-bg:#edf4fa;--color-text:#14263a;--color-border:#195373;--color-accent:#b45309}
*{margin:0;padding:0;box-sizing:border-box}
body{font:1rem system-ui;background:var(--color-bg);color:var(--color-text);display:flex;flex-direction:column;min-height:100vh}
header{background:white;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:100}
.nav{padding:.75rem 1rem}
.nav__inner{max-width:38rem;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.brand{text-decoration:none;color:var(--color-text);font-weight:600;display:flex;align-items:center;gap:.5rem}
.brand:hover{color:var(--color-accent)}
main{flex:1;max-width:38rem;width:100%;margin:0 auto;padding:1rem;display:flex;align-items:center;justify-content:center}
.container{background:white;padding:2rem;border-radius:1rem;width:100%}
input,button{font:inherit;padding:.55rem;margin:.25rem 0}
button{background:var(--color-border);color:white;border:0;border-radius:.35rem;cursor:pointer}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
h1{margin-bottom:1.5rem}
</style>
<header class="nav">
  <div class="nav__inner">
    <a class="brand" href="../../../index.html#projects">← Portfolio</a>
  </div>
</header>
<main>
  <div class="container">
    <h1>Inspection status</h1>
    <form>
      <label for="inspection-id">Inspection ID</label><br>
      <input id="inspection-id" value="INS-101" pattern="INS-[0-9]+" required>
      <button>Look up</button>
    </form>
    <p role="status"></p>
  </div>
</main>
<script>
const form = document.querySelector('form');
const result = document.querySelector('[role=status]');
form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = form.querySelector('button');
    const id = document.querySelector('#inspection-id').value;
    button.disabled = true;
    result.textContent = 'Checking status…';
    try {
        const response = await fetch(`api/inspections/${encodeURIComponent(id)}`);
        const data = await response.json();
        result.textContent = response.ok ? `${data.id} · ${data.status}` : data.error ?? 'Lookup failed.';
    } catch {
        result.textContent = 'The inspection service is unavailable.';
    } finally {
        button.disabled = false;
    }
});
</script>
</html>
